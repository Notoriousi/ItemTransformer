name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle 9.7.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          mkdir -p "$HOME/tools"
          unzip -q /tmp/gradle.zip -d "$HOME/tools"
          echo "$HOME/tools/gradle-9.7.1/bin" >> "$GITHUB_PATH"
          "$HOME/tools/gradle-9.7.1/bin/gradle" --version

      - name: Build with Gradle
        run: |
          set -euo pipefail
          "$HOME/tools/gradle-9.7.1/bin/gradle" build --no-daemon --stacktrace

      - name: List build artifacts
        run: ls -lh build/libs

      - name: Find JAR
        id: jar
        run: |
          set -euo pipefail
          JAR="$(ls -1 build/libs/*.jar | grep -vE -- '(-sources|-javadoc)\.jar$' | head -n1)"
          [ -n "$JAR" ] || { echo "No JAR found in build/libs"; exit 1; }
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Releasing: $JAR (tag: ${RELEASE_TAG})"

      - name: Create GitHub release and upload JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ItemTransformer ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body: |
            ItemTransformer ${{ env.RELEASE_TAG }} — a quality-of-life Fabric addon for ItemSwapper.

            **What's new in 1.2**
            - **Dead code cleanup** — removed unused classes and fields.
            - **Comments cleanup** — tidied up stale/unnecessary comments.
            - **ModMenu support** — added a ModMenu entry with a TRender-based config screen (toggle + Done/Reset buttons) and homepage/issues links in the mod info panel.

            **Requirements**
            - Minecraft 26.3
            - Fabric Loader 0.15.0+
            - Java 25+
            - Fabric API
            - ItemSwapper (MC 26.3)

            **Install**: drop the JAR into `.minecraft/mods` and launch.
          files: ${{ steps.jar.outputs.jar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
