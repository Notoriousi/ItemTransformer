buildscript {
    repositories {
        maven { name = "tr7zw-proxy"; url = "https://maven.tr7zw.dev/repository/maven-public/" }
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.17-SNAPSHOT"
    }
}

plugins {
    id 'java'
}

apply plugin: 'fabric-loom'

version = "1.0"

repositories {
    maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
    maven { name = "tr7zw"; url = "https://maven.tr7zw.dev/repository/maven-public/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"

    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.160.7+26.3"

    // ItemSwapper 26.3 - local pre-built jar (the base mod we extend)
    implementation files("libs/itemswapper-26.3.jar")

    // Transition networking (needed for ItemSwapper classes on classpath)
    implementation "dev.tr7zw:TRansition:1.0.28-26.3-fabric-SNAPSHOT"

    // TRender (RenderContext used by ItemSwapper's palette widgets)
    implementation "dev.tr7zw:TRender:1.0.17-26.3-fabric-SNAPSHOT"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}
